services:
  # Base de datos MongoDB
  mongo:
    image: mongo:latest
    container_name: pasantes_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pasantes_db
    volumes:
      - mongo_data:/data/db

  # Broker MQTT (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: pasantes_mqtt
    restart: always
    ports:
      - "1883:1883"   # Puerto MQTT estándar
      - "9001:9001"   # Websockets si hiciera falta
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # Backend Express (TypeScript)
  backend:
    build: .
    container_name: pasantes_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - HTTP_PORT=3000
      - MONGO_URI=mongodb://mongo:27017/pasantes_db
      - MQTT_URI=mqtt://mqtt:1883
      - TOKEN_SECRET=secret_de_desarrollo_123
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
      - mqtt

volumes:
  mongo_data: